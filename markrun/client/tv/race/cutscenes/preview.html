<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARKRUN cutscene preview</title>
<link rel="stylesheet" href="/client/shared/theme.css">
<style>
  html,body{margin:0;height:100%;background:#0d1020;overflow:hidden;font-family:Nunito,sans-serif}
  #stage{position:absolute;inset:0}
  /* mimics the shell's commentary plate (client/tv/tv.css .sub, as restyled by the cutscene overlay) */
  #sub{position:absolute;left:50%;bottom:1.3%;transform:translateX(-50%);max-width:80%;padding:.3em 1em .35em;background:rgba(20,24,60,.94);border:5px solid #14183c;border-radius:18px;color:#fff;font:800 2.5vw Nunito,sans-serif;text-shadow:0 3px 0 #000;pointer-events:none;z-index:9;white-space:nowrap}
  #sub:empty{display:none}
  #ctl{position:absolute;left:8px;bottom:8px;display:flex;flex-wrap:wrap;gap:4px;z-index:10;max-width:70vw}
  #ctl button{font:13px sans-serif;padding:3px 7px}
  body.shot #ctl{display:none}
</style></head>
<body>
<div id="stage"></div>
<div id="sub"></div>
<div id="ctl"></div>
<script type="module" src="/client/dist/cutscene-preview.js"></script>
</body></html>

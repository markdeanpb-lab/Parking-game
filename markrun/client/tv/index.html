<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MARKRUN — TV</title>
  <link rel="preload" href="/assets/fonts/LilitaOne-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="/tv/tv.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffd23f' stroke='%2314183c' stroke-width='6'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' font-family='Arial Black' fill='%2314183c'%3EM%3C/text%3E%3C/svg%3E">
</head>
<body class="tv sky-bg">
  <div id="race-layer"></div>
  <div id="stage-wrap">
    <div id="stage">
      <div id="screen"></div>
      <div id="hud-top"></div>
      <div id="hud-bottom"></div>
      <div id="subs"></div>
      <div id="reactions"></div>
      <div id="toast"></div>
      <div id="next-hint"></div>
    </div>
  </div>
  <div id="controls">
    <button id="btn-mute" class="ctl" title="Mute (M)">🔊</button>
    <button id="btn-fs" class="ctl" title="Fullscreen (F)">⛶</button>
  </div>
  <div id="conn" class="hidden">Reconnecting to the host…</div>
  <div id="gesture">
    <div class="gesture-card">
      <div class="logo-small outlined">MARKRUN</div>
      <div class="gesture-title outlined white">Click or press any key to start the broadcast</div>
      <div class="gesture-sub">(browsers need a tap before they'll make noise)</div>
    </div>
  </div>
  <script type="module" src="/dist/tv.js"></script>
</body>
</html>
